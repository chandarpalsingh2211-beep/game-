
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Scorpion Cursor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    cursor: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #080b13 0%, #020204 70%);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.hud {
    position: fixed;
    left: 24px;
    bottom: 22px;
    color: #8fa9c9;
    font: 11px monospace;
    letter-spacing: 3px;
    opacity: .7;
    pointer-events: none;
}

.hud span {
    color: #d8f4ff;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>
<div class="hud">BIO-MECHANICAL ENTITY <span>● ONLINE</span></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, DPR;

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

resize();
window.addEventListener("resize", resize);

// Mouse and touch input
const mouse = {
    x: W / 2,
    y: H / 2
};

window.addEventListener("pointermove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("touchmove", e => {
    if (e.touches.length) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    }
}, { passive: true });

// Helpers
const TAU = Math.PI * 2;

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function point(x, y, angle, distance) {
    return {
        x: x + Math.cos(angle) * distance,
        y: y + Math.sin(angle) * distance
    };
}

function strokeLine(a, b, color, width = 1) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.stroke();
}

function glowLine(a, b, color, width = 1) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 9;
    strokeLine(a, b, color, width);
    ctx.restore();
}

function circle(x, y, r, fill, glow = 0) {
    ctx.save();
    ctx.fillStyle = fill;
    ctx.shadowColor = fill;
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
}

// Create the body chain
const BODY_COUNT = 23;
const TAIL_COUNT = 12;

const body = [];
const tail = [];

for (let i = 0; i < BODY_COUNT; i++) {
    body.push({ x: mouse.x, y: mouse.y });
}

for (let i = 0; i < TAIL_COUNT; i++) {
    tail.push({ x: mouse.x, y: mouse.y });
}

let heading = 0;
let lastTime = 0;
let time = 0;

// Move a chain segment while preserving spacing
function follow(chain, spacing, stiffness = 1) {
    for (let i = 1; i < chain.length; i++) {
        const a = chain[i - 1];
        const b = chain[i];

        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const angle = Math.atan2(dy, dx);

        b.x = a.x + Math.cos(angle) * spacing;
        b.y = a.y + Math.sin(angle) * spacing;
    }
}

// Draw a metallic armored body segment
function drawPlate(a, b, width, index) {
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;

    ctx.save();
    ctx.translate(midX, midY);
    ctx.rotate(angle);

    const gradient = ctx.createLinearGradient(
        0, -width, 0, width
    );

    gradient.addColorStop(0, "#e5f7ff");
    gradient.addColorStop(0.15, "#5b7794");
    gradient.addColorStop(0.45, "#111d30");
    gradient.addColorStop(0.75, "#253c58");
    gradient.addColorStop(1, "#b8eaff");

    ctx.fillStyle = gradient;
    ctx.strokeStyle = "rgba(191,228,255,.85)";
    ctx.lineWidth = 0.8;

    ctx.beginPath();
    ctx.ellipse(0, 0, 5.7, width, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();

    // Armor highlight
    ctx.beginPath();
    ctx.moveTo(-2, -width * 0.7);
    ctx.quadraticCurveTo(1, -width * 0.9, 3, -width * 0.35);
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = 0.7;
    ctx.stroke();

    // Central mechanical ridge
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(3, 0);
    ctx.strokeStyle = "rgba(160,220,255,.45)";
    ctx.stroke();

    ctx.restore();

    circle(midX, midY, 1.2, "#e2f8ff", 4);
}

// Articulated legs: four pairs
function drawLeg(anchor, angle, side, index) {
    const gait = Math.sin(time * 8 + index * 1.5) * 4;
    const direction = side;

    const normal = angle + direction * Math.PI / 2;

    const hip = point(anchor.x, anchor.y, normal, 4);

    const knee = {
        x: anchor.x +
           Math.cos(normal) * (17 + gait) +
           Math.cos(angle) * (index % 2 === 0 ? 5 : -5),

        y: anchor.y +
           Math.sin(normal) * (17 + gait) +
           Math.sin(angle) * (index % 2 === 0 ? 5 : -5)
    };

    const foot = {
        x: knee.x +
           Math.cos(normal) * 12 -
           Math.cos(angle) * 7,

        y: knee.y +
           Math.sin(normal) * 12 -
           Math.sin(angle) * 7
    };

    // Upper leg segment
    glowLine(hip, knee, "#718da9", 2.1);
    strokeLine(hip, knee, "#d3efff", 0.65);

    // Lower leg
    glowLine(knee, foot, "#a4c8e5", 1.5);
    strokeLine(knee, foot, "#edfaff", 0.55);

    // Mechanical joints
    circle(hip.x, hip.y, 2.2, "#c5eaff", 5);
    circle(knee.x, knee.y, 2.4, "#d9f3ff", 6);
    circle(foot.x, foot.y, 1.5, "#ffffff", 5);

    // Small pointed feet
    const tip = point(foot.x, foot.y, normal + side * 0.25, 4);
    strokeLine(foot, tip, "#a4c8e5", 0.9);
}

// Draw a claw with two moving pincers
function drawClaw(origin, angle, side) {
    const root = point(origin.x, origin.y, angle, 7);
    const wrist = point(
        root.x, root.y,
        angle + side * 0.35,
        12
    );

    const palm = point(
        wrist.x, wrist.y,
        angle + side * 0.1,
        7
    );

    glowLine(root, wrist, "#9abbd7", 3);
    glowLine(wrist, palm, "#d0edff", 3);

    circle(wrist.x, wrist.y, 2.5, "#e4f7ff", 6);

    // Two curved pincers
    const open = Math.sin(time * 2.2) * 0.10;
    const direction = angle + side * 0.65;

    const base = point(
        palm.x, palm.y,
        direction,
        1
    );

    const outer = point(
        base.x, base.y,
        angle + side * (0.8 + open),
        10
    );

    const tip = point(
        outer.x, outer.y,
        angle + side * (1.25 + open),
        8
    );

    ctx.beginPath();
    ctx.moveTo(palm.x, palm.y);
    ctx.quadraticCurveTo(
        outer.x, outer.y,
        tip.x, tip.y
    );

    ctx.strokeStyle = "#c4eaff";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#76caff";
    ctx.shadowBlur = 7;
    ctx.stroke();
    ctx.shadowBlur = 0;

    circle(tip.x, tip.y, 1.4, "#ffffff", 4);
}

// Draw the head
function drawHead(angle) {
    const head = body[0];

    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(angle);

    const gradient = ctx.createLinearGradient(-4, -9, 10, 9);
    gradient.addColorStop(0, "#dff7ff");
    gradient.addColorStop(0.35, "#263f5a");
    gradient.addColorStop(1, "#080e19");

    ctx.fillStyle = gradient;
    ctx.strokeStyle = "#d4f1ff";
    ctx.lineWidth = 1.2;

    ctx.beginPath();
    ctx.moveTo(-7, -7);
    ctx.lineTo(4, -10);
    ctx.lineTo(11, -3);
    ctx.lineTo(11, 3);
    ctx.lineTo(4, 10);
    ctx.lineTo(-7, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Glowing eyes
    circle(5, -5, 1.7, "#ffffff", 8);
    circle(5, 5, 1.7, "#ffffff", 8);

    ctx.restore();

    // Antenna-like sensors
    for (const side of [-1, 1]) {
        const start = point(head.x, head.y, angle + side * 0.6, 8);
        const end = point(start.x, start.y, angle + side * 0.85, 9);

        glowLine(start, end, "#a4dcff", 1);
        circle(end.x, end.y, 1.3, "#ffffff", 6);
    }

    drawClaw(head, angle, -1);
    drawClaw(head, angle, 1);
}

// Curved armored tail and stinger
function drawTail() {
    const points = tail;
    const base = body[BODY_COUNT - 1];

    // Tail follows the rear body but bends upward
    points[0].x = lerp(points[0].x, base.x, 0.3);
    points[0].y = lerp(points[0].y, base.y, 0.3);

    for (let i = 1; i < points.length; i++) {
        const p = points[i];
        const previous = points[i - 1];

        const t = i / (points.length - 1);

        // Raised arc with a curled end
        const curve = Math.sin(t * Math.PI) * 26;
        const targetX = previous.x - 7;
        const targetY = previous.y - 5 - curve * 0.12;

        p.x = lerp(p.x, targetX, 0.22);
        p.y = lerp(p.y, targetY, 0.22);
    }

    for (let i = 1; i < points.length; i++) {
        const a = points[i - 1];
        const b = points[i];

        const width = Math.max(2, 5 - i * 0.23);

        drawPlate(a, b, width, i);
    }

    const last = points[points.length - 1];
    const prev = points[points.length - 2];

    const angle = Math.atan2(last.y - prev.y, last.x - prev.x);

    const stingerBase = point(last.x, last.y, angle, 4);
    const stingerTip = point(stingerBase.x, stingerBase.y, angle - 0.65, 13);

    glowLine(last, stingerBase, "#d8f4ff", 3);
    glowLine(stingerBase, stingerTip, "#ffffff", 2.2);

    // Sharp metallic tip
    ctx.beginPath();
    ctx.moveTo(stingerTip.x, stingerTip.y);
    ctx.lineTo(
        stingerTip.x + Math.cos(angle - 0.65 + 2.3) * 3,
        stingerTip.y + Math.sin(angle - 0.65 + 2.3) * 3
    );
    ctx.lineTo(
        stingerTip.x + Math.cos(angle - 0.65 - 2.3) * 3,
        stingerTip.y + Math.sin(angle - 0.65 - 2.3) * 3
    );
    ctx.closePath();
    ctx.fillStyle = "#e7f8ff";
    ctx.shadowColor = "#83d7ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
}

// Particle trail
const particles = [];

function addParticle() {
    particles.push({
        x: body[0].x,
        y: body[0].y,
        vx: (Math.random() - 0.5) * 1.1,
        vy: (Math.random() - 0.5) * 1.1,
        life: 1,
        size: Math.random() * 1.7 + 0.4
    });

    if (particles.length > 90) particles.shift();
}

function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt * 0.7;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.globalAlpha = p.life * 0.8;
        circle(p.x, p.y, p.size, "#9bdcff", 5);
    }

    ctx.globalAlpha = 1;
}

// Main animation
function animate(timestamp) {
    const dt = Math.min((timestamp - (lastTime || timestamp)) / 1000, 0.04);
    lastTime = timestamp;
    time += dt;

    ctx.clearRect(0, 0, W, H);

    // Smoothly turn toward the pointer
    const dx = mouse.x - body[0].x;
    const dy = mouse.y - body[0].y;

    const targetAngle = Math.atan2(dy, dx);
    let difference = targetAngle - heading;

    while (difference > Math.PI) difference -= TAU;
    while (difference < -Math.PI) difference += TAU;

    heading += difference * Math.min(1, dt * 8);

    // Move head toward pointer
    body[0].x = lerp(body[0].x, mouse.x, Math.min(1, dt * 9));
    body[0].y = lerp(body[0].y, mouse.y, Math.min(1, dt * 9));

    // Body chain
    for (let i = 1; i < body.length; i++) {
        const a = body[i - 1];
        const b = body[i];

        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        const spacing = i < 15 ? 9 : 8;

        b.x = a.x + Math.cos(angle) * spacing;
        b.y = a.y + Math.sin(angle) * spacing;
    }

    // Draw body legs behind the armor
    for (let i = 5; i <= 15; i += 3) {
        const a = body[i - 1];
        const b = body[i + 1];

        const angle = Math.atan2(b.y - a.y, b.x - a.x);

        drawLeg(body[i], angle, -1, i);
        drawLeg(body[i], angle, 1, i);
    }

    // Body plates
    for (let i = 1; i < body.length; i++) {
        const width = 5.5 - Math.max(0, i - 12) * 0.22;
        drawPlate(body[i - 1], body[i], width, i);
    }

    drawTail();
    drawHead(heading);

    if (Math.random() < 0.35) addParticle();
    drawParticles(dt);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
